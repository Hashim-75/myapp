name: ci

on:
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        run: npm test

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update image tag in config repo
        env:
          TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/gitops-config.git
          cd gitops-config/apps/myapp/overlays/dev
          kustomize edit set image myapp=${IMAGE}:${{ github.sha }}
          cd "$GITHUB_WORKSPACE/gitops-config"
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git commit -am "Deploy myapp ${{ github.sha }} to dev"
          git push
