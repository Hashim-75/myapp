name: ci

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        run: npm test

      - name: Work out lowercase image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}

  update-config:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: update-config
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Check out config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: gitops-config

      - name: Set new image tag
        working-directory: gitops-config/apps/myapp/overlays/dev
        run: kustomize edit set image myapp=${IMAGE}:${{ github.sha }}

      - name: Commit and push
        working-directory: gitops-config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "Deploy myapp ${{ github.sha }} to dev"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 3
          done
